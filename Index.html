<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة بطاقات تليجرام المربحة</title>
    <!-- تضمين مكتبة تليجرام الرسمية -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: #162447;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { color: #e43f5a; font-size: 24px; }
        .stats {
            display: flex;
            justify-content: space-between;
            background: #1f4068;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .card-zone {
            margin: 20px 0;
        }
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .card {
            width: 70px;
            height: 100px;
            background: #e43f5a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 2px solid #fff;
        }
        .comp-card {
            background: #0077b6;
            margin: auto;
        }
        button {
            background-color: #e43f5a;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
        }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .ad-banner {
            margin-top: 25px;
            background: #0f172a;
            padding: 15px;
            border: 2px dashed #e43f5a;
            border-radius: 8px;
            font-size: 12px;
            color: #94a3b8;
        }
        .log { margin-top: 15px; color: #4ecc71; font-weight: bold; min-height: 24px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 لعبة بطاقات الحظ</h1>
    
    <!-- قسم الإحصائيات -->
    <div class="stats">
        <div>نقاطك الكلية: <span id="total-points">0</span></div>
        <div>المحاولات المجانية: <span id="free-spins">3</span>/3</div>
    </div>

    <div class="stats">
        <div>الجولة الحالية: <span id="current-round">0</span>/5</div>
        <div>فوز الجولات: <span id="round-wins">0</span></div>
    </div>

    <!-- منطقة اللعب -->
    <div class="card-zone">
        <h3>بطاقة الحاسوب العشوائية</h3>
        <div class="card comp-card" id="computer-card">؟</div>
    </div>

    <div class="card-zone">
        <h3>بطاقاتك الثلاث العشوائية</h3>
        <div class="cards-container" id="player-cards">
            <div class="card">؟</div>
            <div class="card">؟</div>
            <div class="card">؟</div>
        </div>
    </div>

    <div class="log" id="game-log">اضغط على الزر لبدء الجولة الأولى!</div>

    <!-- أزرار التحكم -->
    <button id="action-btn" onclick="playNextRound()">اسحب البطاقات</button>
    <button id="ad-btn" onclick="watchAdToUnlock()" style="display: none; background-color: #4ecc71;">مشاهدة إعلان للعب مجدداً (مرة كل ساعة)</button>

    <!-- مكان مخصص لإعلانات البانر أو الشبكات الإعلانية -->
    <div class="ad-banner" id="ad-space">
        <p>[ مساحة إعلانية مخصصة للبانر ]</p>
        <!-- هنا سيتم لصق كود الجافاسكريبت الخاص بشبكة الإعلانات المقبولة لاحقاً -->
    </div>
</div>

<script>
    // تهيئة مكتبة تليجرام
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // تمديد الشاشة بالكامل داخل تليجرام

    // المتغيرات الأساسية للعبة (تسترجع البيانات من المتصفح لعدم فقدان النقاط)
    let totalPoints = parseInt(localStorage.getItem('totalPoints')) || 0;
    let freeSpins = localStorage.getItem('freeSpins') !== null ? parseInt(localStorage.getItem('freeSpins')) : 3;
    let lastAdTimestamp = localStorage.getItem('lastAdTimestamp') || 0;

    let currentRound = 0;
    let roundWins = 0;
    let isGameRunning = false;

    // تحديث الواجهة عند تحميل الصفحة
    document.getElementById('total-points').innerText = totalPoints;
    document.getElementById('free-spins').innerText = freeSpins;

    checkAccess();

    // التحقق من صلاحية اللاعب للعب (مجاني أو انتظار ساعة للإعلان)
    function checkAccess() {
        const actionBtn = document.getElementById('action-btn');
        const adBtn = document.getElementById('ad-btn');
        const gameLog = document.getElementById('game-log');

        if (currentRound > 0 && currentRound <= 5) {
            // اللعبة جارية حالياً، لا نوقف الأزرار
            return;
        }

        if (freeSpins > 0) {
            actionBtn.style.display = "block";
            actionBtn.innerText = "بدء لعبة جديدة (5 جولات)";
            adBtn.style.display = "none";
        } else {
            // نفدت المحاولات المجانية، نتحقق من قيود الساعة الخاصة بالإعلان
            const now = Date.now();
            const oneHour = 60 * 60 * 1000; // بالملي ثانية
            
            if (now - lastAdTimestamp >= oneHour) {
                actionBtn.style.display = "none";
                adBtn.style.display = "block";
                adBtn.disabled = false;
                adBtn.innerText = "مشاهدة إعلان للعب مجدداً";
                gameLog.innerText = "انتهت محاولاتك المجانية! شاهد إعلاناً لفتح محاولة جديدة.";
            } else {
                actionBtn.style.display = "none";
                adBtn.style.display = "block";
                adBtn.disabled = true;
                
                // حساب الوقت المتبقي
                const timeLeft = Math.ceil((oneHour - (now - lastAdTimestamp)) / 1000 / 60);
                adBtn.innerText = `يرجى الانتظار (${timeLeft} دقيقة)`;
                gameLog.innerText = "يمكنك مشاهدة إعلان واحد فقط كل ساعة للعب.";
            }
        }
    }

    // تشغيل الجولة أو بدء اللعبة
    function playNextRound() {
        if (!isGameRunning) {
            // خصم محاولة مجانية عند بدء لعبة جديدة كلياً
            freeSpins--;
            localStorage.setItem('freeSpins', freeSpins);
            document.getElementById('free-spins').innerText = freeSpins;
            
            currentRound = 0;
            roundWins = 0;
            isGameRunning = true;
            document.getElementById('round-wins').innerText = roundWins;
        }

        currentRound++;
        document.getElementById('current-round').innerText = currentRound;

        // منطق البطاقات: أرقام عشوائية من 1 إلى 9
        const compNum = Math.floor(Math.random() * 9) + 1;
        const playerCard1 = Math.floor(Math.random() * 9) + 1;
        const playerCard2 = Math.floor(Math.random() * 9) + 1;
        const playerCard3 = Math.floor(Math.random() * 9) + 1;

        // عرض البطاقات على الشاشة
        document.getElementById('computer-card').innerText = compNum;
        
        const playerCardsDiv = document.getElementById('player-cards');
        playerCardsDiv.innerHTML = `
            <div class="card">${playerCard1}</div>
            <div class="card">${playerCard2}</div>
            <div class="card">${playerCard3}</div>
        `;

        // التحقق من الفوز في الجولة (إذا تطابق رقم الحاسوب مع أي من بطاقات اللاعب)
        if (playerCard1 === compNum || playerCard2 === compNum || playerCard3 === compNum) {
            roundWins++;
            document.getElementById('round-wins').innerText = roundWins;
            document.getElementById('game-log').innerText = `الجولة ${currentRound}: فوز! تطابقت البطاقات.`;
            document.getElementById('game-log').style.color = "#4ecc71";
        } else {
            document.getElementById('game-log').innerText = `الجولة ${currentRound}: خسارة! لم تتطابق أي بطاقة.`;
            document.getElementById('game-log').style.color = "#e43f5a";
        }

        // تغيير نص الزر حسب حالة الجولات
        if (currentRound < 5) {
            document.getElementById('action-btn').innerText = `انتقل للجولة ${currentRound + 1}`;
        } else {
            // انتهاء الـ 5 جولات واحتساب النقاط الكلية للعبة
            isGameRunning = false;
            let earnedPoints = 0;

            if (roundWins >= 3) {
                earnedPoints = 50; // نقاط أكثر عند الفوز بغالبية الجولات
                document.getElementById('game-log').innerText = `انتهت اللعبة! فزت بـ ${roundWins} جولات. مبروك حصلت على +50 نقطة!`;
            } else {
                earnedPoints = 10; // نقاط أقل عند الخسارة
                document.getElementById('game-log').innerText = `انتهت اللعبة! فزت بـ ${roundWins} جولات فقط. حصلت على +10 نقاط.`;
            }

            totalPoints += earnedPoints;
            localStorage.setItem('totalPoints', totalPoints);
            document.getElementById('total-points').innerText = totalPoints;

            // إعادة فحص الصلاحية للعب مجدداً
            checkAccess();
        }
    }

    // محاكاة مشاهدة الإعلان وفتح اللعبة مجدداً بعد الضغط
    function watchAdToUnlock() {
        alert("يتم الآن تشغيل الإعلان المربح... (انتظر 15 ثانية)");
        
        // هنا يتم وضع الكود البرمجي للـ SDK الخاص بشركة الإعلانات المستضافة (مثل AdsGram أو Monetag)
        // عند اكتمال عرض الفيديو بنجاح، يتم تشغيل الكود التالي:
        
        setTimeout(() => {
            alert("شكراً لمشاهدة الإعلان! تم منحك محاولة لعب مجانية جديدة.");
            
            // تحديث وقت الإعلان الأخير إلى الوقت الحالي لمنع مشاهدة إعلان آخر قبل مرور ساعة
