<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة بطاقات تليجرام المربحة</title>
    <!-- تصحيح وتضمين مكتبة تليجرام الرسمية -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: #162447;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { color: #e43f5a; font-size: 24px; }
        .stats {
            display: flex;
            justify-content: space-between;
            background: #1f4068;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .card-zone {
            margin: 20px 0;
        }
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            min-height: 104px; /* الحفاظ على المساحة ثابتة */
        }
        .card {
            width: 70px;
            height: 100px;
            background: #e43f5a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 2px solid #fff;
            transition: transform 0.3s ease;
        }
        .comp-card {
            background: #0077b6;
            margin: auto;
        }
        .hidden-card {
            background: #2e3852 !important;
            border: 2px dashed #4e5d78 !important;
            color: transparent !important;
        }
        button {
            background-color: #e43f5a;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
        }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .ad-banner {
            margin-top: 25px;
            background: #0f172a;
            padding: 15px;
            border: 2px dashed #e43f5a;
            border-radius: 8px;
            font-size: 12px;
            color: #94a3b8;
        }
        .log { margin-top: 15px; color: #4ecc71; font-weight: bold; min-height: 24px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 لعبة بطاقات الحظ</h1>
    
    <!-- صوت اللعبة الخلفي -->
    <!-- استبدل رابط السورس المباشر برابط أغنيتك لاحقاً -->
    <audio id="bg-music" loop>
        <source src="https://soundhelix.com" type="audio/mp3">
    </audio>
    
    <!-- قسم الإحصائيات -->
    <div class="stats">
        <div>نقاطك الكلية: <span id="total-points">0</span></div>
        <div>المحاولات المجانية: <span id="free-spins">3</span>/3</div>
    </div>

    <div class="stats">
        <div>الجولة الحالية: <span id="current-round">0</span>/5</div>
        <div>فوز الجولات: <span id="round-wins">0</span></div>
    </div>

    <!-- منطقة اللعب -->
    <div class="card-zone">
        <h3>بطاقة الحاسوب العشوائية</h3>
        <div class="card comp-card hidden-card" id="computer-card">؟</div>
    </div>

    <div class="card-zone">
        <h3>بطاقاتك الثلاث العشوائية</h3>
        <div class="cards-container" id="player-cards">
            <div class="card hidden-card">؟</div>
            <div class="card hidden-card">؟</div>
            <div class="card hidden-card">؟</div>
        </div>
    </div>

    <div class="log" id="game-log">اضغط على زر البدء لتشغيل الموسيقى وسحب البطاقات!</div>

    <!-- أزرار التحكم -->
    <button id="action-btn" onclick="handleActionButton()">بدء اللعبة وتفعيل الموسيقى</button>
    <button id="ad-btn" onclick="watchAdToUnlock()" style="display: none; background-color: #4ecc71;">مشاهدة إعلان للعب مجدداً (مرة كل ساعة)</button>

    <!-- مساحة إعلانية مخصصة للبانر -->
    <div class="ad-banner" id="ad-space">
        <p>[ مساحة إعلانية مخصصة للبانر ]</p>
    </div>
</div>

<script>
    // تهيئة مكتبة تليجرام
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // عناصر الصوت والواجهة
    const bgMusic = document.getElementById('bg-music');

    let totalPoints = parseInt(localStorage.getItem('totalPoints')) || 0;
    let freeSpins = localStorage.getItem('freeSpins') !== null ? parseInt(localStorage.getItem('freeSpins')) : 3;
    let lastAdTimestamp = localStorage.getItem('lastAdTimestamp') || 0;

    let currentRound = 0;
    let roundWins = 0;
    let isGameRunning = false; 

    document.getElementById('total-points').innerText = totalPoints;
    document.getElementById('free-spins').innerText = freeSpins;

    checkAccess();

    function checkAccess() {
        const actionBtn = document.getElementById('action-btn');
        const adBtn = document.getElementById('ad-btn');
        const gameLog = document.getElementById('game-log');

        if (isGameRunning) return;

        if (freeSpins > 0) {
            actionBtn.style.display = "block";
            actionBtn.innerText = "بدء اللعبة (Start Game)";
            adBtn.style.display = "none";
        } else {
            const now = Date.now();
            const oneHour = 60 * 60 * 1000;
            
            if (now - lastAdTimestamp >= oneHour) {
                actionBtn.style.display = "none";
                adBtn.style.display = "block";
                adBtn.disabled = false;
                adBtn.innerText = "مشاهدة إعلان للعب مجدداً";
                gameLog.innerText = "انتهت محاولاتك المجانية! شاهد إعلاناً لفتح محاولة جديدة.";
            } else {
                actionBtn.style.display = "none";
                adBtn.style.display = "block";
                adBtn.disabled = true;
                
                const timeLeft = Math.ceil((oneHour - (now - lastAdTimestamp)) / 1000 / 60);
                adBtn.innerText = `يرجى الانتظار (${timeLeft} دقيقة)`;
                gameLog.innerText = "يمكنك مشاهدة إعلان واحد فقط كل ساعة للعب.";
            }
        }
    }

    // إدارة وظيفة الزر الأساسي بناء على حالة اللعبة
    function handleActionButton() {
        // تشغيل الموسيقى مع أول ضغطة تفاعل من اللاعب (تجنباً لقيود المتصفح)
        if (bgMusic.paused) {
            bgMusic.play().catch(err => console.log("تحتاج لتفاعل لتشغيل الصوت: ", err));
        }

        if (!isGameRunning) {
            // خصم محاولة وبدء الجولة الأولى فوراً
            freeSpins--;
            localStorage.setItem('freeSpins', freeSpins);
            document.getElementById('free-spins').innerText = freeSpins;
            
            currentRound = 0;
            roundWins = 0;
            isGameRunning = true;
            document.getElementById('round-wins').innerText = roundWins;
            
            document.getElementById('action-btn').innerText = "اسحب البطاقات";
        }
        
        playNextRound();
    }

    // منطق تشغيل الجولات والتحقق من تطابق السحب
    function playNextRound() {
        currentRound++;
        document.getElementById('current-round').innerText = currentRound;

        // توليد أرقام عشوائية تبدأ من 0 إلى 9 للكمبيوتر واللاعب
        const compNum = Math.floor(Math.random() * 10);
        const playerCard1 = Math.floor(Math.random() * 10);
        const playerCard2 = Math.floor(Math.random() * 10);
        const playerCard3 = Math.floor(Math.random() * 10);

        // إظهار البطاقات على الشاشة وعرض الأرقام الجديدة
        document.getElementById('computer-card').classList.remove('hidden-card');
        document.getElementById('computer-card').innerText = compNum;
        
        const playerCardsDiv = document.getElementById('player-cards');
        playerCardsDiv.innerHTML = `
            <div class="card">${playerCard1}</div>
            <div class="card">${playerCard2}</div>
            <div class="card">${playerCard3}</div>
        `;

        // فحص توافق أرقام اللاعب مع رقم الكمبيوتر
        if (playerCard1 === compNum || playerCard2 === compNum || playerCard3 === compNum) {
            roundWins++;
            document.getElementById('round-wins').innerText = roundWins;
            document.getElementById('game-log').innerText = `الجولة ${currentRound}: توافق! ربحت الجولة.`;
            document.getElementById('game-log').style.color = "#4ecc71";
        } else {
            // منطق الخسارة: رمي وتصفير بطاقات اللاعب وجعله خاسراً لهذه الجولة
            document.getElementById('game-log').innerText = `الجولة ${currentRound}: لا يوجد توافق! خسرت بطاقاتك.`;
            document.getElementById('game-log').style.color = "#e43f5a";
            
            // محاكاة رمي البطاقات بإفراغ محتواها وجعلها مخفية مجدداً
            playerCardsDiv.innerHTML = `
                <div class="card hidden-card">؟</div>
                <div class="card hidden-card">؟</div>
                <div class="card hidden-card">؟</div>
            `;
            document.getElementById('computer-card').classList.add('hidden-card');
            document.getElementById('computer-card').innerText = "؟";
        }

        // فحص حالة انتهاء اللعبة بعد 5 جولات كاملة
        if (currentRound < 5) {
            document.getElementById('action-btn').innerText = `انتقل للجولة ${currentRound + 1}`;
        } else {
            isGameRunning = false;
            let earnedPoints = 0;

            // تحديد الفوز الإجمالي إذا فاز بـ 3 جولات أو أكثر من أصل 5
            if (roundWins >= 3) {
